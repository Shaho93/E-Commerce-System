spring.application.name=E-Commerce

# Datenbank (lokal per docker compose; in Docker/CI über Umgebungsvariablen überschrieben)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devpass}

# Schema kommt ausschließlich aus Flyway, Hibernate prüft nur
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Erlaubte Frontend-Adressen (CORS), kommagetrennt
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8082,http://localhost:5173}

management.endpoints.web.exposure.include=health,info
